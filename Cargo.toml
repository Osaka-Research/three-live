[workspace]
members = [
    "compiler",
]
resolver = "2"

[profile.release]
# Must be "unwind", not "abort". This crate ships as a `cdylib`/`staticlib` embedded in
# host applications (Android AAR, iOS xcframework), and every FFI and JNI entry point in
# `ffi.rs`/`jni.rs` wraps its body in `catch_unwind` so a Rust panic surfaces as a null
# pointer or a thrown Java exception instead of killing the host process. `panic = "abort"`
# compiles those guards out entirely, turning any recoverable bug into a whole-app crash.
# The cost is some extra landing-pad code size, which is a good trade here.
panic = "unwind"
opt-level = 3
lto = true
codegen-units = 1

