name: Deploy Playgrounds to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-site:
    name: Build Playgrounds & Web Bundles
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build bundles
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble static site (playgrounds + /dist/ bundles)
        run: |
          rm -rf _site
          mkdir -p _site/dist
          cp -R examples/* _site/
          cp dist/*.js dist/*.min.js dist/three-live-sandbox.html _site/dist/
          cp three-live/dist/*.min.js _site/dist/
          cp xr-live/dist/*.js xr-live/dist/*.min.js _site/dist/
          touch _site/.nojekyll
          ls -la _site _site/three _site/xr _site/dist

      - name: Check whether GitHub Pages is enabled for this repository
        id: check_pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is enabled."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled yet (or repository is still private). Built site artifact successfully; enable Pages (Source: GitHub Actions) in repository settings once public."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.check_pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-site:
    name: Deploy to GitHub Pages
    if: needs.build-site.outputs.pages_enabled == 'true'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
